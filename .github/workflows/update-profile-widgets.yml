name: Update Profile Widgets

on:
  schedule:
    - cron: "0 3 * * *"   # once a day at 03:00 UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

jobs:
  update-widgets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Ensure output folder exists
        run: mkdir -p generated

      # --- GitHub stats card ---
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=tedacodder&show_icons=true&theme=dracula&hide_border=true
          path: generated/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Top languages card ---
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=tedacodder&layout=compact&theme=dracula&hide_border=true
          path: generated/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Activity / commit graph ---
      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: tedacodder
          options: theme=dracula&hide_border=true&area=true&custom_title=Commit Trajectory
          output_path: generated/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Streak stats (current streak, longest streak, total contributions) ---
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=tedacodder&theme=dracula&hide_border=true&disable_animations=true
          path: generated/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Featured project pin cards ---
      # EDIT ME: replace "your-repo-name-1" / "your-repo-name-2" with real repo names
      # you own (or contributed to). These render as pinned-repo style cards.
      - name: Generate featured project card 1
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=tedacodder&repo=your-repo-name-1&theme=dracula&hide_border=true
          path: generated/pin-1.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate featured project card 2
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=tedacodder&repo=your-repo-name-2&theme=dracula&hide_border=true
          path: generated/pin-2.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Trophy case (needs a PAT with read:user + public_repo — GITHUB_TOKEN lacks this scope) ---
      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: tedacodder
          output_path: generated/trophy.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      # The action above ignores output_path and always writes to ./trophy.svg
      # at the repo root — move it into generated/ so it actually gets committed.
      - name: Move trophy SVG into generated folder
        run: |
          if [ -f trophy.svg ]; then
            mv trophy.svg generated/trophy.svg
            echo "Moved trophy.svg into generated/"
          elif [ -f generated/trophy.svg ]; then
            echo "trophy.svg already in generated/, nothing to move"
          else
            echo "::warning::trophy.svg not found at repo root or in generated/ — check the previous step's output"
          fi

      # --- Contribution snake ---
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: tedacodder
          outputs: |
            generated/snake.svg
            generated/snake-dark.svg?palette=github-dark

      # --- Commit everything back to the repo ---
      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/*.svg
          git commit -m "chore: refresh profile README widgets" || echo "No changes to commit"
          git push
